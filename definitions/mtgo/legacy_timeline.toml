kind = "banlist"
name = "B&R announcement 2025-11-10"
banned = ["Entomb", "Nadu, Winged Wisdom"]
unbanned = []
notes = "Wizards: 'Effective Date: November 10, 2025' (single date for all platforms). Also Standard: Vivi Ornitier, Screaming Nemesis, Proft's Eidetic Memory banned; Pioneer: Heartfire Hero; Pauper: High Tide banned. MTGO-specific implementation date not found in the 2025-11-11 MTGO weekly blog; assumed same day (Wizards B&R is applied to MTGO on announcement day in this era). Next announcement 2026-02-09."
source = "https://magic.wizards.com/en/news/announcements/banned-and-restricted-november-10-2025"

[[event]]
date = "2026-02-09"
