# Legacy format timeline 2025-01 .. 2026-08. Sources listed per entry.
#
# SUMMARY (compiled 2026-08-20)
# - 8 Wizards B&R announcements fell in the window: 2025-03-31, 2025-06-30, 2025-11-10,
#   2026-02-09, 2026-03-23, 2026-05-18, 2026-06-29, 2026-08-10.
#   5 of them changed Legacy (all bans, no unbans):
#     2025-03-31  Troll of Khazad-dûm, Sowing Mycospawn
#     2025-11-10  Entomb, Nadu, Winged Wisdom
#     2026-05-18  Undercity Informer
#     2026-06-29  Candelabra of Tawnos
#     2026-08-10  The Fantasticar
#   3 explicitly made no Legacy change (2025-06-30, 2026-02-09, 2026-03-23) and are kept as notes.
#   (Context just before the window: 2024-12-16 banned Psychic Frog + Vexing Bauble in Legacy.)
#   Cross-checked against mtg.wiki "Banned and restricted cards/Timeline" (curl'd, 2025/2026 sections)
#   which lists exactly these Legacy changes and nothing else in the window.
# - MTGO effective dates: MTGO applies B&R changes the same day as the announcement in this era
#   (confirmed by MTGO weekly blog for 2025-03-31 "applied in MTGO yesterday" [blog of 04-01],
#   2026-06-29 "now in effect" [blog of 06-30], 2026-08-10 "have been implemented" [blog of 08-11]).
#   For 2025-11-10 and 2026-05-18 the Wizards page gives a single effective date and no MTGO
#   blog text was found; assumed same-day (one third-party summary says 2026-05-19 for Informer).
# - Set releases: paper date from Scryfall; MTGO date from the mtgo.com "<set> on MTGO" articles
#   (all downloaded and read). Standard sets hit MTGO the Tuesday BEFORE paper release.
#   BIG MTGO-SPECIFIC CAVEAT: Marvel's Spider-Man (SPM, paper 2025-09-26) did NOT come to MTGO
#   until 2026-06-16; MTGO instead got the digital set "Through the Omenpaths" (OM1, 2025-09-23),
#   functionally-identical cards under different names that MTGO treats as the same name as
#   their SPM counterparts. OM1 is Arena/MTGO only (no paper), included below for MTGO Legacy.
# - Gaps: Digital-only Arena sets (Pioneer Masters, Alchemy) excluded. Reprint-only products
#   (INR, FCA, EOS, SOA, MAR, PZA) add no new Legacy cards; listed where MTGO got them.
#   The Hobbit (HOB) has no Commander decks; HOC = scene-box/Beyond cards (on MTGO 2026-08-11).

# ---------------------------------------------------------------------------
# Banned & Restricted
# ---------------------------------------------------------------------------

[[event]]
date = "2024-12-16"
effective = "2024-12-16"
kind = "banlist"
name = "B&R announcement 2024-12-16"
banned = ["Psychic Frog", "Vexing Bauble"]
unbanned = []
notes = "Precedes the log window; defines the opening era. Legacy: Psychic Frog and Vexing Bauble banned."
source = "https://magic.wizards.com/en/news/announcements/banned-and-restricted-announcement-december-16-2024"

[[event]]
date = "2025-03-31"
effective = "2025-03-31"
kind = "banlist"
name = "B&R announcement 2025-03-31"
banned = ["Troll of Khazad-dûm", "Sowing Mycospawn"]
unbanned = []
notes = "Wizards: 'Effective Date: March 31, 2025' (all formats; Modern: Underworld Breach banned; Pauper changes). MTGO weekly blog 2025-04-01: 'As announced yesterday on Daily MTG, the following changes were applied in MTGO yesterday: Legacy Banned: Sowing Mycospawn and Troll of Khazad-Dum'. Next announcement was set for 2025-06-30."
source = "https://magic.wizards.com/en/news/announcements/banned-and-restricted-announcement-march-31-2025 ; https://www.mtgo.com/news/mtgo-blog-04012025"

[[event]]
date = "2025-06-30"
effective = "2025-06-30"
kind = "banlist"
name = "B&R announcement 2025-06-30 (no Legacy changes)"
banned = []
unbanned = []
notes = "Legacy: no changes ('It's been a few months since we last took action in Legacy'). Standard: 7 bans (Cori-Steel Cutter, Abuelo's Awakening, Monstrous Rage, Heartfire Hero, Up the Beanstalk, Hopeless Nightmare, This Town Ain't Big Enough). MTGO blog 2025-07-01 confirms only the Standard update applied. Next announcement originally 2025-11-24, later moved up to 2025-11-10."
source = "https://magic.wizards.com/en/news/announcements/banned-and-restricted-june-30-2025 ; https://www.mtgo.com/news/mtgo070125"

[[event]]
date = "2025-11-10"
