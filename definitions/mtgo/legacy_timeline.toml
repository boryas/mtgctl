kind = "banlist"
name = "B&R announcement 2026-02-09 (no Legacy changes)"
banned = []
unbanned = []
notes = "Legacy: no changes (Dimir Tempo most played; Lands, Death and Taxes, Affinity, Cradle decks rising). Only Commander (Biorhythm/Lutri unbanned, Farewell to Game Changers) and Arena formats changed. Article announced new cadence; next announcements 2026-03-23 / 2026-05-18 / 2026-06-29 / 2026-08-10."
source = "https://magic.wizards.com/en/news/announcements/banned-and-restricted-february-9-2026"

[[event]]
date = "2026-03-23"
effective = "2026-03-23"
kind = "banlist"
name = "B&R announcement 2026-03-23 (no Legacy changes)"
banned = []
unbanned = []
notes = "Legacy: no changes ('Legacy looks like it hasn't reached a solved end state...'). Only Historic changed (Food Chain banned). mtg.wiki dates the page 2026-03-24 but title is March 23, 2026."
source = "https://magic.wizards.com/en/news/announcements/banned-and-restricted-march-23-2026"

[[event]]
date = "2026-05-18"
effective = "2026-05-18"
kind = "banlist"
name = "B&R announcement 2026-05-18"
banned = ["Undercity Informer"]
unbanned = []
notes = "Wizards: 'Undercity Informer is banned.' (Oops, All Spells! too dominant; Balustrade Spy left legal). Also Pioneer: Cori-Steel Cutter banned; Modern: Phlage, Titan of Fire's Fury + Lotus Field banned, Violent Outburst + Umezawa's Jitte unbanned; Pauper: Bonder's Ornament unbanned. UNVERIFIED MTGO date: Wizards page states no per-platform date; one third-party summary says effective 2026-05-19; MTGO weekly 2026-05-19 does not mention it. Treat MTGO effective as 2026-05-18 or 2026-05-19. Next announcement 2026-06-29."
source = "https://magic.wizards.com/en/news/announcements/banned-and-restricted-may-18-2026"

[[event]]
date = "2026-06-29"
effective = "2026-06-29"
kind = "banlist"
name = "B&R announcement 2026-06-29"
banned = ["Candelabra of Tawnos"]
unbanned = []
notes = "Wizards: Candelabra of Tawnos banned in Legacy (High Tide / colorless Tron combo), 'Effective Date: June 29, 2026' for tabletop and Magic Online. MTGO weekly blog 2026-06-30: 'Yesterday, Wizards of the Coast announced a ban of Candalabra of Tawnos in Legacy... Both of these actions are now in effect on Magic Online.' Also Pauper: Seeker of Skybreak banned; Brawl: 6 bans. Next announcement 2026-08-10."
source = "https://magic.wizards.com/en/news/announcements/banned-and-restricted-june-29-2026 ; https://www.mtgo.com/news/mtgo063026"

[[event]]
date = "2026-08-10"
effective = "2026-08-10"
kind = "banlist"
name = "B&R announcement 2026-08-10"
banned = ["The Fantasticar"]
unbanned = []
notes = "Wizards: 'The Fantasticar is banned in Legacy. This change is effective as of August 10, 2026.' Also restricted in Vintage; Standard: Badgermole Cub, Stormchaser's Talent, Gran-Gran banned. MTGO weekly blog 2026-08-11 (Tuesday): 'Changes to the Banned & Restricted list announced today by Wizards of the Coast have been implemented on Magic Online... The Fantasticar banned in Legacy and restricted in Vintage' -- so MTGO implementation is 2026-08-10 or at latest 2026-08-11 (the Hobbit launch day). Next announcement 2026-10-12."
source = "https://magic.wizards.com/en/news/announcements/banned-and-restricted-august-10-2026 ; https://www.mtgo.com/news/mtgo081126"

