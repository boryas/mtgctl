# LDC deck names (Legacy Data Collection sheets) mapped into the deck_types vocabulary used by mtgo_game_view.
# `mtgo ldc-import` loads the sheets; `mtgo label` uses each LDC row that names an opponent I faced in that event as a
# labelled anchor. archetype/subtype are the labels written; category falls back to deck_types, then this file.
# A name missing here is used verbatim as the archetype (subtype none). Names mapped to nothing are ignored as anchors.
# `goldfish`: the MTGGoldfish archetype name (metagame page) whose card breakdown is this entry's skeleton; a Goldfish
# name equal to an LDC name needs no field.
# [[alias]]: hand-entered deck names (matches.opponent_deck / deck_name) folded into the same vocabulary, so old entries
# and new ones vote together. Big-mana colorless decks are one archetype, Tron, with subtypes Blue / Mystic Forge / Colorless / Cloudpost.

