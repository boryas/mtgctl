# Advisory deck labels guessed positively from marker cards seen in the logs. Used for BOTH sides:
# my side uses the day+cluster-merged signature, the opponent's side the single match's cards.
# Ordered: the first archetype whose marker is seen wins, then the first matching subtype rule.
# No marker → unknown (never a default). Names follow the deck_types taxonomy ("Archetype: Subtype").
# `mtgctl mtgo label --suggest` prints a skeleton for clusters no rule covers; `--check` scores vs hand data.
# This is a GUESS from cards drawn/played; true decks (my_deck) come from the client's "Deck Used" logs.

