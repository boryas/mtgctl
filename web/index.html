<div class="layout">

<script>

const COLOR_NAMES = { W: 'white', U: 'blue', B: 'black', R: 'red', G: 'green' };

// The query: every filter holds (AND); within one, the values are alternatives (OR). A filter

const lit = (col, v) => NUMERIC.has(col) && /^-?\d+(\.\d+)?$/.test(v) ? v : sq(v);
const VALUE_LABEL = { my_deck_grade: { hard: 'exact from logs', inferred: 'inferred from game', none: 'unknown' }, my_experimental: { 0: 'no', 1: 'yes' }, on_play: { 0: 'on the draw', 1: 'on the play' } };

const showedSql = (s, name) => `(instr('|' || ${s}_seen || '|', ${sq('|' + name + '|')}) > 0 OR instr('|' || ${s}_seen || '|', ${sq('|' + name + ' ×')}) > 0)`;

const CARD_FIELDS = {
  opp_showed: { label: 'opponent showed', neg: 'opponent did not show', side: 'opp', runs: false },
  my_showed: { label: 'I showed', neg: 'I did not show', side: 'my', runs: false },
  opp_runs: { label: "opponent's list runs", neg: "opponent's list lacks", side: 'opp', runs: true },

const COLOR_OPS = { all: 'has all of', exact: 'is exactly', none: 'has none of' };
// Per kind: its ops (the first is the default) and whether a filter of it can be negated.
const KINDS = {

  num: { ops: { is: 'is', '≥': '≥', '≤': '≤' }, negatable: true },
  card: { ops: { is: 'the card', contains: 'a card whose name contains' }, negatable: true },
  colors: { ops: COLOR_OPS, negatable: true },

let FIELDS = {}; // key → {label, group, kind}
function buildFields() {

    if (c === 'my_seen' || c === 'opp_seen') continue; // the card fields ask about these
    const kind = c === 'date' ? 'date' : c.endsWith('_colors') ? 'colors' : NUMERIC.has(c) ? 'num' : 'col';
    FIELDS[c] = { label: LABEL[c], group: GAME_COLS_L[c] ? 'per game' : 'match', kind };
  }
  for (const [k, d] of Object.entries(CARD_FIELDS)) FIELDS[k] = { label: d.label, group: 'cards', kind: 'card' };
  for (const [k, s] of Object.entries(STATS)) if (!s.pair) FIELDS['stat:' + k] = { label: s.label, group: 'on groups (after grouping)', kind: 'stat' };
}
const kindOf = f => f.field && FIELDS[f.field] ? FIELDS[f.field].kind : null;
const active = f => kindOf(f) && f.values.some(v => v === null || String(v).trim() !== '');
function filterSql(f) {

}
function filterText(f) {

  if (!vs.length) return `${F.label} …`;
  const or = xs => xs.join(' or ');

    case 'col': case 'num':
      if (f.op === 'contains') return `${F.label} ${f.not ? "doesn't contain" : 'contains'} ${or(vs.map(v => `“${v}”`))}`;
      if (f.op !== 'is') return `${f.not ? 'not ' : ''}${F.label} ${f.op} ${vs[0]}`;
      return `${F.label} ${f.not ? 'is not' : 'is'} ${or(vs.map(v => valText(f.field, v)))}`;

function whereSql(except) {

}
const OPS = { '≥': (a, b) => a >= b, '≤': (a, b) => a <= b, '>': (a, b) => a > b, '<': (a, b) => a < b };

const PALETTE = ['#2a6fdb', '#d9534f', '#3a9d5d', '#e8a33d', '#8e5ec9', '#1fa2b3', '#b5651d', '#777'];
