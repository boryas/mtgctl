# /etc/nginx/default.d/mtgctl-stats.conf, inside the default_server 443 block of /etc/nginx/nginx.conf.
# This file owns /doomsday/: delete nginx.conf's own `location /doomsday/` block, or `nginx -t` fails on a duplicate location.
# Then `sudo nginx -t && sudo systemctl reload nginx`.
location /mtg/stats/ {
    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1g;
    proxy_read_timeout 900s;
    proxy_request_buffering off;
}

# Installed uploaders and MCP clients carry this prefix, so it must keep proxying; only pages redirect.
location /doomsday/stats/ {
    location ~ ^/doomsday/stats/(?:[a-z]+\.html)?$ {
        rewrite ^/doomsday/stats/(.*)$ /mtg/stats/$1 permanent;
    }
    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1g;
    proxy_read_timeout 900s;
    proxy_request_buffering off;
}

# libmtg's deploy.sh writes here.
location /mtg/doomsday/ {
    alias /usr/local/share/site/static/mtg/doomsday/;
}

location /doomsday/ {
    rewrite ^/doomsday/(.*)$ /mtg/doomsday/$1 permanent;
}
