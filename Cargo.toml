[package]
name = "mtgctl"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
diesel = { version = "2.1", features = ["sqlite", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
dialoguer = "0.11"
toml = "0.8"
comfy-table = "7.1"
skim = "0.10"
textplots = "0.8"
rand = { version = "0.8", features = ["small_rng"] }
regex = "1"
serde_json = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }
sha2 = "0.10"
# static SQLite so the mtgctl-web binary runs on hosts without matching sqlite-libs
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
flate2 = "1"
